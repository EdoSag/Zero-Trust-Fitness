# Builds a signed release APK on every push to main and publishes it as a
# GitHub Release, so the app can be downloaded and installed without Google
# Play. Pull requests get the same build as a downloadable artifact (no
# release), which shows a change still builds before it is merged.
#
# One-time setup (Settings > Secrets and variables > Actions > New secret):
#   ANDROID_KEYSTORE_BASE64   the release keystore, base64 encoded
#   ANDROID_KEYSTORE_PASSWORD its password (store and key use the same one)
# Every build must be signed with the same keystore, or Android refuses to
# install an update over the previous version.
name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_SLUG: zero-trust-fitness
  APP_TITLE: Zero-Trust Fitness

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: Flutter 3.50 deprecates package:flutter/material.dart, which
          # fails analyze. Same version as Zero-Trust-Core CI.
          flutter-version: 3.47.9
          cache: true

      - name: Write .env when it is not committed
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -f .env ]; then
            echo "Using the .env committed in the repository."
          elif [ -n "$ENV_FILE" ]; then
            printf '%s\n' "$ENV_FILE" > .env
            echo "Wrote .env from the ENV_FILE secret."
          else
            # Public client values (the Supabase URL and publishable key ship
            # inside every APK anyway). Set an ENV_FILE secret to override.
            cat > .env <<'ENVEOF'
          SUPABASE_URL=https://ohgxpnchqmisvktqjmcx.supabase.co
          SUPABASE_ANON_KEY=sb_publishable_C1geAnwr0LZSxfQKRg21YA_G-OXHYky
          ENVEOF
            echo "Wrote .env with the shared public Supabase values."
          fi

      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/codemagic.keystore"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # Lets a PR still prove the app builds; this APK will not install
            # over a released one. Releases never use a throwaway key.
            echo "::warning::Signing secrets not set; signing this PR build with a throwaway key."
            KEYSTORE_PASSWORD=$(openssl rand -hex 16)
            echo "::add-mask::$KEYSTORE_PASSWORD"
            keytool -genkeypair -keystore "$RUNNER_TEMP/codemagic.keystore" -storetype PKCS12 \
              -alias zerotrust -keyalg RSA -keysize 2048 -validity 1 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -dname "CN=PR build"
          else
            echo "::error::Missing signing secrets. Add ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD under Settings > Secrets and variables > Actions."
            exit 1
          fi
          # android/app/build.gradle.kts reads these (shared names across the apps).
          {
            echo "CM_BUILD_DIR=$RUNNER_TEMP"
            echo "CM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "CM_KEY_ALIAS=zerotrust"
            echo "CM_KEY_PASSWORD=$KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Drop machine-specific Gradle settings
        # A local org.gradle.java.home (e.g. a Windows Android Studio path)
        # breaks the Linux runner; setup-java provides the JDK here.
        run: sed -i '/^org\.gradle\.java\.home=/d' android/gradle.properties

      - name: Cache the Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle-dist
          key: gradle-dist-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Fetch Gradle with retries
        # The wrapper's own download has no retry, and GitHub's release
        # downloads sometimes answer 504. Fetch it once with retries, keep it
        # cached, and point the wrapper at the local file.
        run: |
          PROPS=android/gradle/wrapper/gradle-wrapper.properties
          URL=$(sed -nE 's/^distributionUrl=(.*)/\1/p' "$PROPS" | sed 's/\\:/:/g')
          FILE="$HOME/.gradle-dist/$(basename "$URL")"
          mkdir -p "$HOME/.gradle-dist"
          if [ ! -s "$FILE" ]; then
            curl -fsSL --retry 6 --retry-all-errors --retry-delay 20 -o "$FILE" "$URL"
          fi
          sed -i "s#^distributionUrl=.*#distributionUrl=file\\:$FILE#" "$PROPS"

      - run: flutter pub get

      - name: Build the release APK
        run: |
          set -e
          VERSION=$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)
          # versionCode must grow with every build so updates install over
          # the previous APK; 1000 + run number stays above old pubspec codes.
          BUILD=$((1000 + GITHUB_RUN_NUMBER))
          flutter build apk --release --build-number="$BUILD"
          APK="$APP_SLUG-$VERSION-build$BUILD.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          {
            echo "VERSION=$VERSION"
            echo "BUILD=$BUILD"
            echo "APK=$APK"
          } >> "$GITHUB_ENV"

      - name: Build the Wear OS APK
        # The watch companion (android/wear), signed with the same key.
        # `flutter build apk` above wrote android/gradlew and local.properties.
        run: |
          set -e
          (cd android && ./gradlew :wear:assembleRelease -PztBuild="$BUILD" --stacktrace)
          WEAR_APK="$APP_SLUG-wear-$VERSION-build$BUILD.apk"
          cp build/wear/outputs/apk/release/wear-release.apk "$WEAR_APK"
          echo "WEAR_APK=$WEAR_APK" >> "$GITHUB_ENV"

      - name: Build the Google Play bundles
        # Google Play takes .aab files, not .apk: one for the phone and one
        # for the watch, uploaded to the same listing (the watch one under
        # the Wear OS form factor). Built for releases (and manual runs) only,
        # so pull request checks stay fast.
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
        run: |
          set -e
          flutter build appbundle --release --build-number="$BUILD"
          AAB="$APP_SLUG-$VERSION-build$BUILD.aab"
          cp build/app/outputs/bundle/release/app-release.aab "$AAB"
          (cd android && ./gradlew :wear:bundleRelease -PztBuild="$BUILD" --stacktrace)
          WEAR_AAB="$APP_SLUG-wear-$VERSION-build$BUILD.aab"
          cp build/wear/outputs/bundle/release/wear-release.aab "$WEAR_AAB"
          {
            echo "AAB=$AAB"
            echo "WEAR_AAB=$WEAR_AAB"
          } >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: env.AAB != ''
        with:
          name: ${{ env.AAB }}
          path: |
            ${{ env.AAB }}
            ${{ env.WEAR_AAB }}
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: |
            ${{ env.APK }}
            ${{ env.WEAR_APK }}
          retention-days: 14

      - name: Publish the GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION-build$BUILD"
          SUBJECT=$(git log -1 --pretty=%s)
          gh release create "$TAG" "$APK" "$WEAR_APK" ${AAB:+"$AAB"} ${WEAR_AAB:+"$WEAR_AAB"} \
            --target "$GITHUB_SHA" \
            --title "$APP_TITLE $VERSION (build $BUILD)" \
            --notes "Latest change: $SUBJECT

          Download **$APK** below and open it on your phone to install or update. Android may ask you to allow installs from this source the first time.

          For a Wear OS watch, install **$WEAR_APK** on the watch (for example with adb, or the Play Store once listed).

          The .aab files are for uploading to the Google Play Console; phones and watches install the .apk files." \
            --latest
