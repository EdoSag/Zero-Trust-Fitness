name: zerotrust_fitness
description: Zero-Trust Fitness, end-to-end encrypted activity and health tracking.
publish_to: none
version: 0.6.0+10
environment:
  sdk: ^3.8.0

# Builds package:sqlite3 as SQLite3 Multiple Ciphers, which encrypts the core's
# local store as a whole file and can also read the old SQLCipher vault once
# to bring its data over. Required by zero_trust_core.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

dependencies:
  flutter:
    sdk: flutter
  # Shared account, keys, vault lock, sync, settings and look for every
  # Zero-Trust app.
  zero_trust_core:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zero_trust_core
      ref: a6f8e52391fd8be806f7b38abb97a0f17d6035de # v0.8.1 (Core PR #15; switch to the tag once it is pushed)
  flutter_riverpod: ^3.5.0
  supabase_flutter: ^2.10.0
  sqlite3: ^3.7.0
  cryptography: ^2.7.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.3
  flutter_dotenv: ^5.1.0
  health: ^13.3.2
  home_widget: 0.8.0
  fl_chart: 1.0.0
  shimmer: 3.0.0
  path_provider: ^2.1.5
  geolocator: 13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  share_plus: ^13.3.0
  file_picker: ^13.3.2
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  intl: ^0.20.1
  archive: ^4.6.0
  flutter_tts: ^4.2.5
  # Already in the build through other packages: GPX files (F7) and the
  # offline map tile cache (F8).
  xml: ^7.1.0
  http: ^1.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/
    - .env
